[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpipe"
dynamic = ["version"]
description = "Async Python wrapper for coding agent CLIs — delegate, cascade, and orchestrate Aider, Claude Code, Gemini, Kilo Code, OpenCode, QoderCLI, Vibe"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "coding-agent", "claude", "gemini", "opencode", "aider", "kilo", "vibe", "llm", "async"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.11",
    # The server tests exercise the real FastAPI app through its HTTP surface.
    # Without these they were skipped, and CI was green on an untested server.
    # starlette's test client moved to httpx2 in 1.6; an older starlette imports
    # plain httpx and the whole test module dies on import instead of running.
    "fastapi",
    "starlette>=1.6",
    "httpx2>=2.10",
    "sse-starlette",
]

[tool.setuptools.dynamic]
version = {attr = "agentpipe.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["agentpipe*"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PIE", "C4", "ERA", "B", "RUF010", "RUF013", "RUF100", "PT", "SIM", "RSE", "FURB", "A", "PERF401", "RET505", "TCH", "S602"]
ignore = ["SIM117", "SIM105", "SIM108", "PT009"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
