version: "3.9"

services:
  agentpipe:
    build: .
    image: ghcr.io/tigregotico/agentpipe:latest
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
      # Provider auth state (persists login sessions)
      - ~/.local/share/kilo:/root/.local/share/kilo
      - ~/.config/opencode:/root/.config/opencode
      - ~/.claude:/root/.claude
      - ~/.config/gemini:/root/.config/gemini
      - ~/.vibe:/root/.vibe
    environment:
      - AGENTPIPE_CWD=/workspace
      # API keys — set in .env or shell env
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    restart: unless-stopped
