version: "3.9"

services:
  agentpipe:
    build: .
    image: ghcr.io/tigregotico/agentpipe:latest
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
      # Provider auth state (persists login sessions)
      # Mounting these hands your host logins to whatever runs in the container.
      - ~/.local/share/kilo:/root/.local/share/kilo
      - ~/.local/share/opencode:/root/.local/share/opencode
      - ~/.claude:/root/.claude
      - ~/.gemini:/root/.gemini
      - ~/.vibe:/root/.vibe
      - ~/.qoder:/root/.qoder
    environment:
      - AGENTPIPE_CWD=/workspace
      # API keys — set in .env or shell env
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      # Server security — set AGENTPIPE_API_KEY to require auth
      - AGENTPIPE_API_KEY=${AGENTPIPE_API_KEY:-}
      - AGENTPIPE_MAX_PROMPT_LENGTH=${AGENTPIPE_MAX_PROMPT_LENGTH:-100000}
      - AGENTPIPE_AGENT_TTL=${AGENTPIPE_AGENT_TTL:-3600}
    restart: unless-stopped
